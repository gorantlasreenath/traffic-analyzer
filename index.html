<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Traffic Intelligence</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #0ea5e9;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: #f8fafc;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard {
            width: 90%;
            max-width: 1000px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #818cf8, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .upload-section {
            border: 2px dashed var(--glass-border);
            padding: 30px;
            border-radius: 15px;
            transition: 0.3s;
            margin-bottom: 30px;
            text-align: center;
        }

        .upload-section:hover {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.05);
        }

        input[type="file"] { display: none; }
        
        .custom-file-upload {
            padding: 12px 24px;
            background: var(--primary);
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
            font-weight: 600;
            transition: 0.3s;
        }

        .custom-file-upload:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
        }

        .stat-card h3 { color: #94a3b8; font-size: 0.9rem; margin: 0; }
        .stat-card p { font-size: 1.8rem; font-weight: bold; margin: 10px 0 0 0; }

        .visuals {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .visuals { grid-template-columns: 1fr; }
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { color: #94a3b8; padding-bottom: 15px; border-bottom: 1px solid var(--glass-border); }
        td { padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }

        canvas { max-width: 100% !important; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <h1>🚦 Traffic Intelligence</h1>
        <p>Real-time video analysis & classification</p>
    </div>

    <div class="upload-section" id="dropZone">
        <i class="fas fa-cloud-upload-alt fa-3x" style="margin-bottom: 15px; color: var(--secondary);"></i>
        <form id="uploadForm">
            <label for="fileInput" class="custom-file-upload">Choose Video File</label>
            <input type="file" id="fileInput" accept="video/*" required>
            <p id="fileName" style="margin-top: 10px; font-size: 0.9rem; color: #94a3b8;"></p>
            <button type="submit" style="background: none; border: 1px solid #38bdf8; color: white; padding: 8px 20px; border-radius: 8px; cursor: pointer; margin-top: 10px;">Analyze Now</button>
        </form>
    </div>

    <div id="result" style="display:none;">
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Detected</h3>
                <p id="total">0</p>
            </div>
            <div class="stat-card">
                <h3>Traffic Density</h3>
                <p id="density">Low</p>
            </div>
        </div>

        <div class="visuals">
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>Type</th><th>Count</th></tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td>🚗 Cars</td><td id="car">0</td></tr>
                        <tr><td>🚌 Buses</td><td id="bus">0</td></tr>
                        <tr><td>🚛 Trucks</td><td id="truck">0</td></tr>
                        <tr><td>🚶 Pedestrians</td><td id="pedestrian">0</td></tr>
                        <tr><td>🏍️ Motorcycles</td><td id="motorcycle">0</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="chart-container">
                <canvas id="myChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. SECURITY CHECK
    if (localStorage.getItem("traffic_auth") !== "true") {
        window.location.href = "home.html";
    }

    function logout() {
        localStorage.removeItem("traffic_auth");
        window.location.href = "home.html";
    }

    // 2. FILE NAME DISPLAY
    document.getElementById('fileInput').onchange = function() {
        if (this.files[0]) {
            document.getElementById('fileName').innerText = "Selected: " + this.files[0].name;
        }
    };

    // 3. THE ANALYZE FUNCTION (Fixed & Single)
    document.getElementById("uploadForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        
        let fileInput = document.getElementById("fileInput");
        let file = fileInput.files[0];
        let statusText = document.getElementById("fileName");

        if (!file) return alert("Please select a video first!");

        // UI Feedback
        statusText.innerHTML = '<i class="fas fa-spinner fa-spin"></i> AI is analyzing frames... Please wait.';
        document.getElementById("result").style.display = "none"; 

        let formData = new FormData();
        formData.append("file", file);

        try {
            const response = await fetch("http://127.0.0.1:5000/upload", {
                method: "POST",
                body: formData
            });

            if (!response.ok) throw new Error("Server Error");

            const data = await response.json();
            console.log("AI Results:", data);

            // SUCCESS! 
            statusText.innerText = "✅ Analysis Complete!";
            document.getElementById("result").style.display = "block";

            // Update Text Stats
            document.getElementById("total").innerText = data.total || 0;
            document.getElementById("density").innerText = data.density || "Low";
            document.getElementById("car").innerText = data.car || 0;
            document.getElementById("bus").innerText = data.bus || 0;
            document.getElementById("truck").innerText = data.truck || 0;
            document.getElementById("pedestrian").innerText = data.pedestrian || 0;
            document.getElementById("motorcycle").innerText = data.motorcycle || 0;

            // 4. Update Chart (Calls the function below)
            updateChart(data);

        } catch (err) {
            console.error("Fetch Error:", err);
            statusText.innerText = "❌ Connection Error. Is your Flask (app.py) running?";
        }
    });

    // 5. CHART HELPER FUNCTION (Restored)
    function updateChart(data) {
        const ctx = document.getElementById('myChart').getContext('2d');
        
        if (window.myTrafficChart) { 
            window.myTrafficChart.destroy(); 
        }

        window.myTrafficChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Cars', 'Buses', 'Trucks', 'Pedestrians', 'Motorcycles'],
                datasets: [{
                    data: [data.car, data.bus, data.truck, data.pedestrian, data.motorcycle],
                    backgroundColor: ['#4f46e5', '#0ea5e9', '#818cf8', '#f472b6', '#fbbf24'],
                    borderColor: 'transparent'
                }]
            },
            options: { 
                responsive: true,
                plugins: { 
                    legend: { 
                        position: 'bottom',
                        labels: { color: '#f8fafc', padding: 20 } 
                    } 
                } 
            }
        });
    }

</script>

</body>
</html>
